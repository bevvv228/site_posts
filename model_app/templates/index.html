<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(160deg, #D9E7E8 0%, #C3D7DA 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: #25252B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* КАРТОЧКА ГЛАВНОЙ */
        .home-card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 16px 36px rgba(37, 37, 43, 0.10);
            padding: 2rem 2rem 2.2rem;
        }

        /* ЗАГОЛОВОК */
        h2 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #25252B;
            margin-bottom: 1rem;
            border-left: 5px solid #528A9A;
            padding-left: 1rem;
        }

        /* ПРИВЕТСТВИЕ */
        .greeting {
            font-size: 1rem;
            background: #EDF4F5;
            padding: 0.9rem 1rem;
            border-radius: 18px;
            margin: 1.2rem 0 1.5rem 0;
            color: #25252B;
            border: 1px solid #D9E7E8;
            font-weight: 500;
        }

        /* КНОПКА ПОСТОВ */
        .posts-link {
            display: inline-block;
            background: #528A9A;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.75rem 1.8rem;
            border-radius: 40px;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.05s;
            margin-bottom: 1.8rem;
        }
        .posts-link:hover {
            background: #406E7B;
            transform: translateY(-1px);
        }

        /* ССЫЛКИ АВТОРИЗАЦИИ */
        .auth-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #E3EDEF;
        }
        .auth-links a {
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.5rem 1.3rem;
            border-radius: 40px;
            background: #EAF2F3;
            color: #2C4A54;
            transition: all 0.2s;
        }
        .auth-links a:hover {
            background: #D9E7E8;
            transform: translateY(-1px);
        }
        /* ВЫХОД — ТЁМНАЯ КНОПКА */
        .auth-links .logout-link,
        .auth-links a[href="/logout"] {
            background: #25252B;
            color: #D9E7E8;
        }
        .auth-links .logout-link:hover,
        .auth-links a[href="/logout"]:hover {
            background: #3A3A42;
        }

        @media (max-width: 500px) {
            .home-card { padding: 1.5rem; }
            h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="home-card">
    <h2>Главная</h2>
    <div class="greeting">
        Привет, {{ user.username|default:"Гость" }}!
    </div>
    <a href="posts" class="posts-link">📄 Посты</a><div class="auth-links">
        {% if user.is_authenticated %}
            {% include "logout.html" %}
            <a href="/reset_password">Сменить пароль</a>
        {% else %}
            <a href="/login">Войти</a>
            <a href="/register">Регистрация</a>
        {% endif %}
    </div>
</div>
</body>
</html>
